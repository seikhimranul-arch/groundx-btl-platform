[build]
  publish = "."

[[redirects]]
  from = "/promoter"
  to = "/promoter.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/client-portal"
  to = "/client-portal.html"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/client-portal.html"
  status = 200

[[redirects]]
  from = "/brand"
  to = "/brand-sheet.html"
  status = 200

[[redirects]]
  from = "/brand-sheet"
  to = "/brand-sheet.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.arcgisonline.com https://*.openstreetmap.org; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
